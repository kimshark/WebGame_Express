<!DOCTYPE html>
<html lang="en-us" style="width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Express_Game</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20;">
    
    <canvas id="unity-canvas" tabindex="-1" style="width: 100%; height: 100%; background: #231F20; display: block;"></canvas>
    
    <script src="Build/MyGameBuild.loader.js"></script>
    <script>
      // 🚀 [★점수 연동 마스터 패치] 유니티가 외치는 SendScoreToReact 전용 안테나 설치
      window.SendScoreToReact = function(param1, param2) {
        console.log("🎮 유니티가 브라우저 안테나를 흔들었습니다:", param1, param2);
        
        let name = "Player";
        let score = 0;

        // case 1: 유니티가 (이름, 점수) 두 개를 순서대로 던졌을 때
        if (param2 !== undefined) {
          name = String(param1);
          score = Number(param2);
        } else {
          // case 2: 점수만 던졌거나 JSON 문자열로 뭉뚱그려 던졌을 때의 예외 처리
          if (isNaN(param1)) {
            try {
              const data = JSON.parse(param1);
              name = data.name || "Player";
              score = data.score || 0;
            } catch(e) {
              name = String(param1);
            }
          } else {
            score = Number(param1);
          }
        }

        console.log(`📡 매칭 완료! 백엔드로 발사합니다 -> 이름: ${name}, 점수: ${score}`);

        // 🎯 우리 Express 백엔드 서버의 점수 저장 API로 직접 POST 요청 발사!
        fetch('/api/leaderboard', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name: name, score: score })
        })
        .then(response => response.json())
        .then(data => {
          console.log('✅ 백엔드 장부에 점수 등록 완료:', data);
        })
        .catch(error => console.error('❌ 백엔드 전송 실패:', error));
      };

      // 모바일 기기 감지 스타일 코드
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/MyGameBuild.data",
        frameworkUrl: "Build/MyGameBuild.framework.js",
        codeUrl: "Build/MyGameBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Express_Game",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
